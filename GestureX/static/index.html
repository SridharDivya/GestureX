<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GestureX</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mute:#5b6b85;--acc:#1f4fd8;--ok:#0f9d6b;--line:#d5dce8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1830;--card:#17234a;--ink:#e8eefc;--mute:#9db0d6;--acc:#7ea2ff;--line:#2a3a68}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:16px 20px;font-size:22px;font-weight:700;letter-spacing:.2px}
header span{color:var(--mute);font-weight:400;font-size:14px;margin-left:8px}
main{display:grid;gap:16px;padding:0 16px 24px;max-width:1100px;margin:auto;grid-template-columns:1.3fr 1fr}
@media(max-width:800px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{margin:0 0 10px;font-size:16px}
.stage{position:relative;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:4/3}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#local,#overlay{transform:scaleX(-1)}
#remote{display:none;position:absolute;right:8px;bottom:8px;width:32%;height:auto;inset:auto 8px 8px auto;border:2px solid #fff;border-radius:6px;z-index:2}
.live{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;padding:4px 10px;border-radius:99px;font-size:14px;z-index:2}
#text{min-height:84px;font-size:22px;padding:10px;border:1px solid var(--line);border-radius:8px;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,input{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--acc);color:#fff;border:0}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input{flex:1;min-width:120px}
small,.mute{color:var(--mute)}
#signs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#signs b{background:var(--bg);border:1px solid var(--line);padding:2px 10px;border-radius:99px;font-weight:500}
#remoteText{margin-top:10px;padding:10px;border-left:4px solid var(--ok);background:var(--bg);display:none}
</style>
</head>
<body>
<header>GestureX<span>Sign language to text and speech, on your device</span></header>
<main>
  <section>
    <div class="stage">
      <video id="local" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <video id="remote" autoplay playsinline></video>
      <div class="live" id="live">Show a sign</div>
    </div>
    <div class="row">
      <button id="camBtn" class="alt">Start camera</button>
      <input id="room" placeholder="Room name" value="gesturex">
      <button id="callBtn">Start call</button>
      <button id="hangBtn" class="alt">End call</button>
    </div>
    <div id="remoteText"></div>
  </section>

  <section>
    <h2>Your sentence</h2>
    <div id="text" aria-live="polite"></div>
    <div class="row">
      <button id="speakBtn">Speak</button>
      <button id="sendBtn" class="alt">Send to caller</button>
      <button id="clearBtn" class="alt">Clear</button>
    </div>
    <label class="row"><input type="checkbox" id="autoSpeak" style="flex:none"> Read each new word aloud</label>

    <h2 style="margin-top:20px">Teach a sign</h2>
    <div class="row">
      <input id="label" placeholder="Word for this sign, e.g. hello">
      <button id="recBtn">Record 40 frames</button>
    </div>
    <small>Hold the sign steady. Record 2 or 3 times from slightly different angles.</small>
    <div id="signs"></div>
    <div class="row">
      <button id="exportBtn" class="alt">Export signs</button>
      <button id="importBtn" class="alt">Import signs</button>
      <button id="resetBtn" class="alt">Delete all</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
    <p class="mute" id="status"></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
